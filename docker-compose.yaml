x-common-environment: &common-env
  PUID: ${PUID:-1001}
  PGID: ${PGID:-1001}
  TZ: ${TZ:-America/Fortaleza}

x-media-volume-1: &media-volume-1
  type: bind
  source: ${MEDIA_PATH}
  target: /media

x-media-volume-2: &media-volume-2
  type: bind
  source: ${MEDIA_2_PATH}
  target: /media-2

x-torrent-volume: &torrent-volume
  type: bind
  source: ${TORRENTS_PATH}
  target: /torrents

x-service-default: &service-default
  restart: 'unless-stopped'
  networks:
    - homelab
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      JELLYFIN_DOMAIN: "${JELLYFIN_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
    depends_on:
      - jellyfin
    <<: *service-default

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: ${PUID:-1001}:${PGID:-1001}
    volumes:
      - *media-volume-1
      - *media-volume-2
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:8096:8096/tcp
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:7359:7359/udp
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    <<: *service-default

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 3344
      TORRENTING_PORT: 6881
    volumes:
      - ./config/qbittorrent:/config
      - ./themes/qbittorrent:/themes/qbittorrent
      - *media-volume-1
      - *media-volume-2
      - *torrent-volume
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:3344:3344
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:6881:6881
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:6881:6881/udp
    <<: *service-default

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./config/prowlarr:/config
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:9696:9696
    <<: *service-default

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./config/radarr:/config
      - *media-volume-1
      - *media-volume-2
      - *torrent-volume
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:7878:7878
    <<: *service-default

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./config/sonarr:/config
      - *media-volume-1
      - *media-volume-2
      - *torrent-volume
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:8989:8989
    <<: *service-default

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ./config/bazarr:/config
      - *media-volume-1
      - *media-volume-2
    ports:
      - ${LAN_IP:?LAN IP is required in .env - see env.example}:6767:6767
    <<: *service-default

  cloudflare-ddns:
    build: ./cloudflare-ddns
    container_name: cloudflare-ddns
    environment:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}"
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID}"
      CLOUDFLARE_RECORD_NAME: "${CLOUDFLARE_RECORD_NAME}"
      CLOUDFLARE_RECORD_TYPE: "${CLOUDFLARE_RECORD_TYPE:-A}"
      CLOUDFLARE_TTL: "${CLOUDFLARE_TTL:-300}"
      CLOUDFLARE_PROXIED: "${CLOUDFLARE_PROXIED:-true}"
      CF_DDNS_INTERVAL_SECONDS: "${CF_DDNS_INTERVAL_SECONDS:-300}"
    <<: *service-default

networks:
  homelab:
    name: homelab
